name: Course Seat Watch

on:
  # 由 cron-job.org 每 15 分钟调用 workflow_dispatch API 触发
  workflow_dispatch:

permissions:
  contents: read

# 同一时间只跑一个；上一轮未结束时新触发排队（GitHub 最多保留 1 个 pending），避免重复登录触发操作次数限制
concurrency:
  group: seat-watch
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 25   # 单次约 14 分钟 + 环境准备，留出余量

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      # 恢复上次已通知的空位状态（缓存 key 不可覆盖，所以每次用 run_id 新建并按前缀恢复最新的）
      - name: Restore notified state
        uses: actions/cache/restore@v4
        with:
          path: .state
          key: seat-state-${{ github.run_id }}
          restore-keys: seat-state-

      - name: Run seat monitor
        run: python -u seat_watch.py
        env:
          PYTHONUNBUFFERED: "1"
          BASE: ${{ secrets.BASE }}
          USER_ID: ${{ secrets.USER_ID }}
          PASSWORD: ${{ secrets.PASSWORD }}
          BARK_KEY_1: ${{ secrets.BARK_KEY_1 }}
          BARK_KEY_2: ${{ secrets.BARK_KEY_2 }}

      - name: Save notified state
        if: always()
        uses: actions/cache/save@v4
        with:
          path: .state
          key: seat-state-${{ github.run_id }}
