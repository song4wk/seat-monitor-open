<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Seat Watch Status</title>
<style>
  :root { --bg:#fff; --fg:#1f2328; --muted:#656d76; --line:#d0d7de; --ok:#1a7f37; --err:#cf222e; --skip:#9a6700; --free:#0969da; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#0d1117; --fg:#e6edf3; --muted:#8d96a0; --line:#30363d; --ok:#3fb950; --err:#f85149; --skip:#d29922; --free:#58a6ff; }
  }
  body { margin:0; padding:16px; background:var(--bg); color:var(--fg); font:15px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; }
  main { max-width:760px; margin:0 auto; }
  h1 { font-size:18px; margin:0 0 12px; }
  .card { border:1px solid var(--line); border-radius:8px; padding:16px; margin-bottom:16px; }
  .big { font-size:22px; font-weight:600; }
  .ok { color:var(--ok); } .error { color:var(--err); } .skipped { color:var(--skip); } .free { color:var(--free); }
  .muted { color:var(--muted); font-size:13px; }
  .stale { border-color:var(--err); }
  .banner { color:var(--err); font-weight:600; margin-bottom:8px; }
  table { width:100%; border-collapse:collapse; font-size:13px; }
  th, td { text-align:left; padding:6px 8px; border-bottom:1px solid var(--line); }
  a { color:var(--free); }
</style>
</head>
<body>
<main>
  <h1>Seat Watch Status</h1>
  <div class="card" id="latest">読み込み中…</div>
  <table>
    <thead><tr><th>时间 (JST)</th><th>结果</th><th>最后空位数</th><th>检查次数</th><th>通知</th><th></th></tr></thead>
    <tbody id="rows"></tbody>
  </table>
  <p class="muted">只显示数量，不含具体空位。页面每 60 秒自动刷新。</p>
</main>
<script>
// 每轮约 15 分钟，超过这个时间没有新记录就认为监控停了
const STALE_MINUTES = 40;
const LABEL = { ok: "✅ 正常", error: "❌ 异常", skipped: "⏭️ 跳过" };
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({ "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;" }[c]));
const fmt = iso => iso ? iso.replace("T", " ").slice(0, 19) : "未检查";
const notified = r => r.notified_new + r.notified_repeat + r.notified_remind;

function ago(iso) {
  const min = Math.round((Date.now() - new Date(iso).getTime()) / 60000);
  return min < 1 ? "刚刚" : min < 60 ? `${min} 分钟前` : `${Math.round(min / 60)} 小时前`;
}

async function load() {
  let runs = [];
  try {
    const res = await fetch("status.json?" + Date.now());
    runs = (await res.json()).runs || [];
  } catch (e) { /* 还没有数据 */ }
  const latest = document.getElementById("latest");
  if (!runs.length) { latest.textContent = "暂无运行记录"; return; }
  const r = runs[0];
  const staleMin = Math.round((Date.now() - new Date(r.time).getTime()) / 60000);
  const stale = staleMin > STALE_MINUTES;
  latest.classList.toggle("stale", stale);
  latest.innerHTML =
    (stale ? `<div class="banner">⚠️ 数据已 ${staleMin} 分钟没有更新，监控可能已停止</div>` : "") +
    `<div class="big ${esc(r.result)}">${LABEL[r.result] || esc(r.result)}</div>` +
    `<div>最后一次检查空位数：<span class="big ${r.last_free ? "free" : ""}">${r.last_free ?? "未检查"}</span></div>` +
    `<div class="muted">最后成功检查：${fmt(r.last_checked_at)}</div>` +
    `<div class="muted">本轮结束：${fmt(r.time)}（${ago(r.time)}）${r.reason ? " · " + esc(r.reason) : ""}</div>`;
  document.getElementById("rows").innerHTML = runs.slice(0, 50).map(r =>
    `<tr><td>${fmt(r.time)}</td><td class="${esc(r.result)}">${LABEL[r.result] || esc(r.result)}</td>` +
    `<td>${r.last_free ?? "未检查"}</td><td>${r.checks}</td><td>${notified(r)}</td>` +
    `<td>${r.run_url ? `<a href="${esc(r.run_url)}">log</a>` : ""}</td></tr>`).join("");
}
load();
setInterval(load, 60000);
</script>
</body>
</html>
